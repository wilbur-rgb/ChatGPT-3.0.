<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Chat Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #212121; color: #ececec; display: flex; flex-direction: column; height: 100vh; }
        
        /* The Top Navigation Bar */
        .top-nav {
            background-color: #171717;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2f2f2f;
        }
        .logo { font-weight: bold; font-size: 1.1rem; color: #b4b4b4; }
        .nav-btn {
            background-color: #2f2f2f;
            color: #ececec;
            border: 1px solid #424242;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .nav-btn:hover { background-color: #424242; color: #fff; }

        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 800px; width: 100%; margin: 0 auto; }
        .message-row { display: flex; width: 100%; gap: 12px; }
        .user-row { flex-direction: row-reverse; }
        .ai-row { flex-direction: row; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; font-size: 0.8rem; }
        .ai-avatar { background-color: #10a37f; color: white; }
        .user-avatar { background-color: #543fd7; color: white; }
        .bubble { max-width: 75%; padding: 10px 16px; border-radius: 20px; font-size: 1rem; line-height: 1.5; white-space: pre-wrap; }
        .user-bubble { background-color: #2f2f2f; }
        .ai-bubble { background-color: transparent; padding-left: 0; }
        .input-container { background-color: #212121; padding: 20px; width: 100%; }
        .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; background-color: #2f2f2f; border-radius: 24px; padding: 10px 14px; border: 1px solid #424242; }
        #prompt { flex: 1; background: transparent; border: none; color: #fff; font-size: 1rem; padding: 6px 10px; outline: none; }
        .send-arrow { background-color: #676767; color: #171717; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
        .send-arrow:hover { background-color: #fff; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo">Phi-3 Chat</div>
        <!-- Link to the next page -->
        <a href="images.html" class="nav-btn">Go to Image Search →</a>
    </div>

    <div id="chat-container">
        <div class="message-row ai-row">
            <div class="avatar ai-avatar">AI</div>
            <div class="bubble ai-bubble">Hello! I am focused entirely on text chat on this page. How can I help you?</div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="prompt" placeholder="Message Phi-3..." autocomplete="off">
            <button class="send-arrow" onclick="askOllama()">↑</button>
        </div>
    </div>

    <script>
        document.getElementById('prompt').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); askOllama(); }
        });

        async function askOllama() {
            const promptInput = document.getElementById('prompt');
            const chatContainer = document.getElementById('chat-container');
            const promptText = promptInput.value.trim();
            if (!promptText) return;

            promptInput.value = '';

            // User Message
            const userRow = document.createElement('div');
            userRow.className = 'message-row user-row';
            userRow.innerHTML = `<div class="avatar user-avatar">ME</div><div class="bubble user-bubble">${promptText}</div>`;
            chatContainer.appendChild(userRow);

            // AI Message Container
            const aiRow = document.createElement('div');
            aiRow.className = 'message-row ai-row';
            const responseBubble = document.createElement('div');
            responseBubble.className = 'bubble ai-bubble';
            responseBubble.innerText = "Thinking...";
            aiRow.innerHTML = `<div class="avatar ai-avatar">AI</div>`;
            aiRow.appendChild(responseBubble);
            chatContainer.appendChild(aiRow);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'phi3:mini', prompt: promptText, stream: true })
                });

                responseBubble.innerText = '';
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.trim() !== '') {
                            const parsed = JSON.parse(line);
                            responseBubble.innerText += parsed.response;
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }
                    }
                }
            } catch (error) {
                responseBubble.innerText = "Error connecting to local server.";
            }
        }
    </script>
</body>
</html>
